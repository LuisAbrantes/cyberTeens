<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTeens - Quiz de Riscos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .question-card {
            display: none;
            animation: fadeIn 0.5s;
        }
        .question-card.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .scenario {
            background: #f0f4ff;
            border-left: 5px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
        }
        .scenario strong {
            color: #667eea;
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .option input[type="radio"] {
            margin-right: 10px;
        }
        .option label {
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .option input[type="radio"]:checked + label {
            font-weight: bold;
            color: #667eea;
        }
        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }
        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .feedback.incorrect {
            background: #ffebee;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button.btn-next {
            background: #667eea;
            color: white;
        }
        button.btn-next:hover {
            background: #5568d3;
        }
        button.btn-reset {
            background: #999;
            color: white;
        }
        button.btn-reset:hover {
            background: #777;
        }
        .progress {
            background: #ddd;
            height: 8px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            background: #667eea;
            height: 100%;
            transition: width 0.3s;
        }
        .counter {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .results {
            display: none;
            text-align: center;
        }
        .results.show {
            display: block;
        }
        .results h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            margin: 0 auto 20px;
        }
        .result-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 CyberTeens - Quiz de Segurança</h1>
        <p class="subtitle">Teste seus conhecimentos sobre riscos na internet</p>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="counter">
            <span id="currentQuestion">1</span> de <span id="totalQuestions">10</span>
        </div>

        <div id="quizContainer"></div>

        <div class="results" id="results">
            <h2>🎉 Quiz Completo!</h2>
            <div class="score-circle" id="scoreCircle"></div>
            <div class="result-message" id="resultMessage"></div>
            <button class="btn-reset" onclick="resetQuiz()">Fazer Quiz Novamente</button>
        </div>
    </div>

    <script src="cyber.js"></script>
</body>
</html>
